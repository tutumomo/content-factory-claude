<!doctype html>
<html lang="zh-Hant">
<head>

<title>內容工廠</title>
<link rel="stylesheet" href="/static/style.css?v=20261122e">
</head>
<body>
<div id="app" class="app layout-top">
<script>
try {
  if (localStorage.getItem("cf_nav_layout") === "side") {
    document.getElementById("app").className = "app layout-side";
  }
} catch {}
</script>
  <header class="shell-nav">
    <a href="#/content" class="brand">
      <span class="brand-title">內容工廠</span>
      <small>agent 做苦工，你做決定</small>
    </a>
    <nav class="shell-links" aria-label="主導覽">
      <a href="#/ideas" data-nav="ideas">靈感</a>

        <button type="button" class="btn icon-btn" id="btn-layout" title="切換導覽列位置（頂部 / 左側）"></button>
        <button type="button" class="btn icon-btn" id="btn-settings" title="系統設定">⚙</button>
      </div>
    </div>
  </header>
  <main id="main" class="shell-main"></main>
</div>
